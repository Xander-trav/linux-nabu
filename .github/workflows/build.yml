# This workflow builds an Arch Linux package without 
# GPG signature and using self-signed SB keys (for UKI)
# USED ONLY TO TEST CHANGES BEFORE PR

name: Build Test Package

on:
  workflow_dispatch:

env:
  # Arch Linux ARM mirror (fl.us is unreachable from runners, use working one)
  MIRROR: "http://os.archlinuxarm.org/$arch/$repo"
  MIRROR_HOST: "http://os.archlinuxarm.org"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    
    permissions:
      packages: read
      contents: write

    container: 
      image: ghcr.io/rodriguezst/archlinux-builder:latest

    steps:
      - name: Fix mirrorlist (fl.us mirror is unreachable from runner)
        run: |
          # Test which mirrors work from this runner
          for url in \
            "$MIRROR_HOST" \
            "http://ca.us.mirror.archlinuxarm.org" \
            "http://nj.us.mirror.archlinuxarm.org" \
            "http://archlinuxarm.org"; do
            code=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$url" 2>&1 || echo "FAIL")
            echo "$url -> $code"
          done
          echo "Server = $MIRROR" | \
            sudo tee /etc/pacman.d/mirrorlist

      - name: Update system
        run: |
          for i in 1 2 3; do
            sudo pacman -Syu --noconfirm --retry 3 && break
            sleep 5
          done
  
      - name: Setup git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure makepkg
        run: |
          echo "PACKAGER='GitHub Actions Builder <github-actions[bot]@users.noreply.github.com>'" >> ~/.makepkg.conf
          echo "PKGEXT='.pkg.tar.xz'" >> ~/.makepkg.conf
          echo "SRCEXT='.src.tar.gz'" >> ~/.makepkg.conf
          echo "MAKEFLAGS='-j$(nproc)'" >> ~/.makepkg.conf

      - name: Generate secure boot test keys
        run: |
          for i in 1 2 3; do
            sudo pacman -S --needed --noconfirm --retry 3 openssl && break
            sleep 5
          done
          openssl genrsa -out sb.key 2048
          openssl req -new -x509 -key sb.key -out sb.crt -days 365 \
            -subj "/C=US/ST=Test/L=Test/O=GitHub Actions Test/CN=Test SB Certificate"
          echo "Generated secure boot test keys:"
          ls -la sb.key sb.crt
          openssl x509 -in sb.crt -text -noout | head -n 10

      - name: Build package
        shell: bash
        run: |
          export SB_SIGN_KEY=$(pwd)/sb.key
          export SB_SIGN_CERT=$(pwd)/sb.crt
          # skipchecksums allows modifying config without updating PKGBUILD hashes
          makepkg -s --noconfirm --clean --skippgpcheck --skipchecksums
          rm -f sb.key sb.crt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: |
            *.pkg.tar.xz
            *.pkg.tar.xz.sig
